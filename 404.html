<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the chart — Ram Milan Kumar Verma</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2ece0'/%3E%3Cpath d='M4 20c4-6 8 6 12 0s8-6 12 0' stroke='%232f5d70' fill='none' stroke-width='1.6'/%3E%3Cpath d='M4 25c4-6 8 6 12 0s8-6 12 0' stroke='%232f5d70' fill='none' stroke-width='1' opacity='.5'/%3E%3Ccircle cx='16' cy='9' r='3.2' stroke='%23a8552f' fill='none' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Spectral:wght@300&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ece0;--ink:#1b2730;--ink-soft:#4e5a63;--ink-faint:#8a9299;
  --sea:#2f5d70;--sea-deep:#1d3f4e;--copper:#a8552f;--rule:rgba(27,39,48,.18);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f171d;--ink:#e7dfd1;--ink-soft:#a9b4bb;--ink-faint:#71808a;
  --sea:#79aebf;--sea-deep:#a7cddb;--copper:#d98b5f;--rule:rgba(231,223,209,.17);
}}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{
  margin:0;min-height:100svh;background:var(--paper);color:var(--ink);
  font-family:"Spectral",Georgia,serif;font-weight:300;line-height:1.6;
  display:flex;align-items:center;justify-content:center;padding:8vh 6vw;
  -webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
}
#c{position:absolute;inset:-5% -10%;width:120%;height:110%;pointer-events:none}
#c path{fill:none;stroke:var(--sea);stroke-width:.85;opacity:.22;vector-effect:non-scaling-stroke}
.box{position:relative;z-index:1;max-width:44ch}
.mono{font-family:"Courier Prime","Courier New",monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sea)}
h1{
  font-family:"Fraunces",Georgia,serif;font-weight:300;font-variation-settings:"SOFT" 12,"WONK" 1;
  font-size:clamp(2.2rem,7vw,4.6rem);line-height:.95;letter-spacing:-.035em;margin:.35em 0 0;
}
h1 em{font-style:italic;font-weight:500;color:var(--sea-deep)}
p{color:var(--ink-soft);margin:1.4em 0 2.2em;max-width:34ch}
a.back{
  font-family:"Courier Prime","Courier New",monospace;font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--copper);padding-bottom:5px;transition:color .3s ease,letter-spacing .3s ease;
}
a.back:hover,a.back:focus-visible{color:var(--copper);letter-spacing:.22em}
:focus-visible{outline:2px solid var(--copper);outline-offset:4px}
::selection{background:var(--copper);color:var(--paper)}
</style>
</head>
<body>
<svg id="c" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 1000 700"></svg>
<div class="box">
  <p class="mono">Error 404 — no sounding</p>
  <h1>Off the <em>chart</em></h1>
  <p>Nothing is recorded at this position. The page may have been moved, renamed, or never charted at all.</p>
  <a class="back" href="/">← Return to the log</a>
</div>
<script>
(function(){
  var svg=document.getElementById("c"),W=1000,H=700,N=14,NS="http://www.w3.org/2000/svg";
  var seed=4040404;
  function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
  var waves=[];for(var w=0;w<4;w++)waves.push({amp:16+rnd()*40,freq:(0.9+rnd()*2.6)/W*Math.PI*2,ph:rnd()*Math.PI*2});
  var frag=document.createDocumentFragment();
  for(var i=0;i<N;i++){
    var base=-60+i*(H+140)/N,drift=i*0.42,d="";
    for(var x=-40;x<=W+40;x+=26){
      var y=base;
      for(var k=0;k<waves.length;k++){
        var v=waves[k];
        y+=v.amp*Math.sin(x*v.freq*(1+k*0.35)+v.ph+drift*(0.6+k*0.3))*(0.45+0.55*Math.sin(i*0.5+k));
      }
      d+=(x===-40?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);
    }
    var p=document.createElementNS(NS,"path");p.setAttribute("d",d);frag.appendChild(p);
  }
  svg.appendChild(frag);
})();
</script>
</body>
</html>
